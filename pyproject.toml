[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "piqcx"
version = "0.1.0"
description = "JAX Path integral Quantum Control (PiQC) for closed and open systems"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Aarón Villanueva" }]
keywords = ["quantum control", "path integral", "jax", "open quantum systems"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "jax>=0.4.30",
  "jaxlib>=0.4.30",
  "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "matplotlib>=3.8"]
notebooks = ["jupyter>=1.0", "matplotlib>=3.8"]
gpu = ["jax[cuda12]"]

[project.urls]
Homepage = "https://github.com/aaronuv/piqc"
Paper = "https://arxiv.org/abs/2410.18635"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
